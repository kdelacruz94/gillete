[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gillete"
version = "0.1.0"
description = "Native Linux profiles, macros and onboard programming for Razer Naga mice"
requires-python = ">=3.11"
dependencies = ["evdev>=1.7", "PySide6>=6.6"]

[project.scripts]
gillete = "gillete.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
